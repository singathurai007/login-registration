<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & Registration</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <!-- Login Form -->
        <div class="form-box">

            <h1>Login</h1>

            <form id="loginForm">

                <input
                    type="email"
                    id="loginEmail"
                    placeholder="Enter your email"
                    required
                >

                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Enter your password"
                    required
                >

                <button type="submit">
                    Login
                </button>

            </form>

            <p id="loginMessage"></p>

            <p>
                Don't have an account?
                <a href="register.html">Register</a>
            </p>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
